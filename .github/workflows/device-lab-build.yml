name: Device Lab Native Build

on:
  push:
    branches:
      - device-lab-build-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Apply source compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('device-lab-ci/app/src/main/java/com/devicelab/app/MainActivity.java')
          s=p.read_text()
          start=s.index('    private void startMic(){')
          end=s.index('    private void stopMic(){', start)
          new='''    private void startMic(){
              if(checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED){
                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},REQ_MIC);
                  return;
              }
              if(micRunning)return;
              try{
                  final int rate=16000;
                  int min=AudioRecord.getMinBufferSize(rate,AudioFormat.CHANNEL_IN_MONO,AudioFormat.ENCODING_PCM_16BIT);
                  if(min<=0)min=4096;
                  audioRecord=new AudioRecord(MediaRecorder.AudioSource.MIC,rate,AudioFormat.CHANNEL_IN_MONO,AudioFormat.ENCODING_PCM_16BIT,Math.max(min,4096));
                  if(audioRecord.getState()!=AudioRecord.STATE_INITIALIZED){
                      audioRecord.release();
                      audioRecord=null;
                      Toast.makeText(this,"Micro non initialisable",Toast.LENGTH_LONG).show();
                      return;
                  }
                  micRunning=true;
                  audioRecord.startRecording();
                  micThread=new Thread(new Runnable(){
                      @Override public void run(){
                          short[] buf=new short[1024];
                          while(micRunning&&audioRecord!=null){
                              int n=audioRecord.read(buf,0,buf.length);
                              if(n>0){
                                  double sum=0;
                                  for(int i=0;i<n;i++){
                                      double sample=buf[i]/32768.0;
                                      sum+=sample*sample;
                                  }
                                  double rms=Math.sqrt(sum/n);
                                  final double db=rms>0?20*Math.log10(rms):-120;
                                  final int meter=(int)Math.max(0,Math.min(100,(db+80)*1.25));
                                  ui.post(new Runnable(){
                                      @Override public void run(){
                                          if(micValue!=null)micValue.setText(String.format(Locale.ROOT,"%.1f dBFS",db));
                                          if(micMeter!=null)micMeter.setProgress(meter);
                                      }
                                  });
                              }
                          }
                      }
                  },"DeviceLabMic");
                  micThread.start();
              }catch(Exception e){
                  micRunning=false;
                  Toast.makeText(this,"Micro indisponible: "+e.getClass().getSimpleName(),Toast.LENGTH_LONG).show();
              }
          }
          '''
          p.write_text(s[:start]+new+s[end:])
          PY

      - name: Build Device Lab
        run: |
          chmod +x device-lab-ci/build.sh
          device-lab-ci/build.sh

      - name: Android 15 launch smoke test
        run: |
          yes | sdkmanager "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n devlab_api35 -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd devlab_api35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/devlab-emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$BOOT" = "1" ] && break
            sleep 2
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]
          adb install -r device-lab-ci/dist/DeviceLab-v4.0.apk
          adb logcat -c
          adb shell am force-stop com.devicelab.app
          adb shell am start -W -n com.devicelab.app/.MainActivity | tee /tmp/devlab-am-start.txt
          sleep 5
          adb shell dumpsys activity activities > /tmp/devlab-activities.txt
          adb logcat -d > /tmp/devlab-logcat.txt
          grep -F "com.devicelab.app/.MainActivity" /tmp/devlab-activities.txt
          if grep -A20 -B5 -E "FATAL EXCEPTION|Process: com.devicelab.app" /tmp/devlab-logcat.txt; then
            echo "Device Lab launch crash detected" >&2
            exit 1
          fi
          echo "DEVICE LAB LAUNCH SMOKE TEST: PASS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceLab-v4-native
          if-no-files-found: error
          path: |
            device-lab-ci/dist/DeviceLab-v4.0.apk
            device-lab-ci/dist/DeviceLab-v4.0.apk.sha256
