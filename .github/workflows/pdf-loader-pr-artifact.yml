name: Pdf Loader PR Artifact Build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct source
        run: |
          set -euo pipefail
          base64 -d pdf-loader-source.tgz.b64 > pdf-loader-project.tgz
          tar -xzf pdf-loader-project.tgz
      - name: Build APK
        working-directory: pdf-loader-project
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose pdf-loader-project/app/build/outputs/apk/debug/app-debug.apk"
      - name: Collect
        run: |
          mkdir -p out
          cp pdf-loader-project/app/build/outputs/apk/debug/app-debug.apk out/PdfLoader-v0.1-debug.apk
          sha256sum out/PdfLoader-v0.1-debug.apk > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PdfLoader-v0.1-debug
          path: out/
