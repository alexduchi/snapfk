name: TracePilot R7 Build
on:
  push:
    branches:
      - 'tracepilot-r7-*'
    paths:
      - 'tracepilot-r7-project.zip'
      - '.github/workflows/tracepilot-r7-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack project
        run: unzip -q tracepilot-r7-project.zip
      - name: Build native Android APK
        run: bash tracepilot_r7_project/build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tracepilot-r7-build
          path: |
            tracepilot_r7_project/dist/TracePilot-R7-FULLCORE-UNSIGNED.apk
            tracepilot_r7_project/dist/sha256.txt
            tracepilot-r7-project.zip
          if-no-files-found: error
          retention-days: 2
