name: TracePilot R7 Build
on:
  push:
    branches: ['tracepilot-r7-*']
    paths:
      - 'tracepilot-r7/**'
      - '.github/workflows/tracepilot-r7-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'platform-tools'
      - name: Build current TracePilot R7 Java source
        run: bash tracepilot-r7/build.sh
      - name: Inspect APK
        run: |
          $ANDROID_HOME/build-tools/35.0.1/aapt2 dump badging tracepilot-r7/dist/TracePilot-R7-FULLCORE-UNSIGNED.apk | tee tracepilot-r7/dist/badging.txt
          unzip -l tracepilot-r7/dist/TracePilot-R7-FULLCORE-UNSIGNED.apk | tee tracepilot-r7/dist/apk-entries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tracepilot-r7-build
          path: tracepilot-r7/dist/*
          if-no-files-found: error
          retention-days: 2
