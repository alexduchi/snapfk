name: Image Toolbox Crash Fix Build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Reconstruct final source and apply launch hardening
        run: |
          set -euo pipefail
          cat \
            ci/image-toolbox/source.part.00 \
            ci/image-toolbox/source.part.01 \
            ci/image-toolbox/source.part.02 \
            ci/image-toolbox/source.part.03a \
            ci/image-toolbox/source.part.03b0 \
            ci/image-toolbox/source.part.03e0 \
            ci/image-toolbox/source.part.03f0 \
            ci/image-toolbox/source.part.03f1 \
            ci/image-toolbox/source.part.03d1 \
            ci/image-toolbox/source.part.03d2 \
            ci/image-toolbox/source.part.03d3 \
            ci/image-toolbox/source.part.03d4 \
            ci/image-toolbox/source.part.03d5 \
            ci/image-toolbox/source.part.03d6 \
            ci/image-toolbox/source.part.04 \
            | base64 -d > ImageToolbox-source.zip
          echo '934d7684c37907505921b66d5d87e8e685388b0acb34db5cb9a3ddd4ed04f4e0  ImageToolbox-source.zip' | sha256sum -c -
          unzip -q ImageToolbox-source.zip
          sed -i '/postSplashScreenTheme/d' ImageToolboxProject/res/values-v31/styles.xml ImageToolboxProject/res/values-night-v31/styles.xml
          sed -i 's/public static View divider(Context c)/public static View dividerView(Context c)/' ImageToolboxProject/src/com/imagetoolbox/app/Ui.java
          sed -i 's/,ExifInterface.TAG_GPS_DIRECTION_MAGNETIC//' ImageToolboxProject/src/com/imagetoolbox/app/ImageUtils.java
          sed -i 's/ExifInterface.TAG_PHOTOGRAPHIC_SENSITIVITY/"ISOSpeedRatings"/g' ImageToolboxProject/src/com/imagetoolbox/app/ImageUtils.java
          sed -i 's/ExifInterface.TAG_LENS_MAKE/"LensMake"/g' ImageToolboxProject/src/com/imagetoolbox/app/ImageUtils.java
          sed -i 's/ExifInterface.TAG_LENS_MODEL/"LensModel"/g' ImageToolboxProject/src/com/imagetoolbox/app/ImageUtils.java
          sed -i 's/android:theme="@style\/AppTheme.Splash"/android:theme="@style\/AppTheme"/' ImageToolboxProject/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ImageToolboxProject/src/com/imagetoolbox/app/MainActivity.java')
          s=p.read_text()
          s=s.replace('@Override protected void onCreate(Bundle b){super.onCreate(b);setContentView(build());handleIncoming(getIntent());}', '@Override protected void onCreate(Bundle b){super.onCreate(b);try{setContentView(build());}catch(Throwable t){setContentView(buildSafeFallback());}try{handleIncoming(getIntent());}catch(Throwable ignored){}}')
          s=s.replace('@Override protected void onResume(){super.onResume();refreshHistory();}', '@Override protected void onResume(){super.onResume();try{refreshHistory();}catch(Throwable ignored){}}')
          needle='    private View build(){ScrollView sv=new ScrollView(this);'
          insert='''    private View buildSafeFallback(){\n        ScrollView sv=new ScrollView(this);\n        LinearLayout root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(Ui.dp(this,20),Ui.dp(this,24),Ui.dp(this,20),Ui.dp(this,32)); root.setBackgroundColor(Ui.bg(this));\n        TextView title=Ui.title(this,"Image Toolbox",26); root.addView(title);\n        root.addView(Ui.space(this,8)); root.addView(Ui.subtitle(this,"Mode de démarrage sécurisé")); root.addView(Ui.space(this,22));\n        Button choose=Ui.button(this,"Choisir une image",true); choose.setOnClickListener(v->pick(ImageUtils.OP_RESIZE)); root.addView(choose,new LinearLayout.LayoutParams(-1,Ui.dp(this,52)));\n        root.addView(Ui.space(this,10)); Button batch=Ui.button(this,"Traitement par lot",false); batch.setOnClickListener(v->startActivity(new Intent(this,BatchActivity.class))); root.addView(batch,new LinearLayout.LayoutParams(-1,Ui.dp(this,52)));\n        root.addView(Ui.space(this,10)); Button settings=Ui.button(this,"Réglages",false); settings.setOnClickListener(v->startActivity(new Intent(this,SettingsActivity.class))); root.addView(settings,new LinearLayout.LayoutParams(-1,Ui.dp(this,52)));\n        sv.addView(root); return sv;\n    }\n\n'''
          if needle not in s: raise SystemExit('MainActivity insertion point missing')
          s=s.replace(needle,insert+needle)
          p.write_text(s)
          p=Path('ImageToolboxProject/src/com/imagetoolbox/app/Ui.java')
          s=p.read_text()
          old='''    public static ImageView logo(Context c, int sizeDp) {\n        ImageView i=new ImageView(c); i.setImageResource(R.drawable.ic_brand_mark); i.setScaleType(ImageView.ScaleType.FIT_CENTER); i.setLayoutParams(new LinearLayout.LayoutParams(dp(c,sizeDp),dp(c,sizeDp))); return i;\n    }'''
          new='''    public static ImageView logo(Context c, int sizeDp) {\n        ImageView i=new ImageView(c);\n        try { i.setImageResource(R.drawable.ic_brand_mark); } catch (Throwable ignored) { i.setBackground(shape(ACCENT, 16, c)); }\n        i.setScaleType(ImageView.ScaleType.FIT_CENTER); i.setLayoutParams(new LinearLayout.LayoutParams(dp(c,sizeDp),dp(c,sizeDp))); return i;\n    }'''
          if old not in s: raise SystemExit('Ui.logo block missing')
          p.write_text(s.replace(old,new))
          PY
          chmod +x ImageToolboxProject/build.sh
          bash ImageToolboxProject/build.sh
          (cd ImageToolboxProject && zip -qr ../ImageToolbox-source-fixed.zip . -x 'build/*')
          sha256sum ImageToolboxProject/build/ImageToolbox.apk > ImageToolbox-SHA256.txt
      - name: Verify APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose ImageToolboxProject/build/ImageToolbox.apk
          unzip -t ImageToolboxProject/build/ImageToolbox.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ImageToolbox-crash-fixed
          path: |
            ImageToolboxProject/build/ImageToolbox.apk
            ImageToolbox-source-fixed.zip
            ImageToolbox-SHA256.txt
