name: Pdf Loader Android Build

on:
  push:
    branches:
      - pdf-loader-build-20260824
    paths:
      - 'pdf-loader-source.tgz.b64'
      - '.github/workflows/pdf-loader-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pdf-loader-source.tgz.b64'
      - '.github/workflows/pdf-loader-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode source
        shell: bash
        run: |
          base64 -d pdf-loader-source.tgz.b64 > pdf-loader-project.tgz
          tar -xzf pdf-loader-project.tgz

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: pdf-loader-project
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp pdf-loader-project/app/build/outputs/apk/debug/app-debug.apk out/PdfLoader-v0.4.1-debug.apk
          sha256sum out/PdfLoader-v0.4.1-debug.apk | tee out/SHA256.txt

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose out/PdfLoader-v0.4.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfLoader-v0.4.1-debug
          path: out/
          if-no-files-found: error

      - name: Build marker
        run: echo artifact-ready
