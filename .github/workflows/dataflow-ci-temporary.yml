name: DataFlow Temporary CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-dataflow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore DataFlow source
        run: |
          base64 -d dataflow-source.b64 > source.tar.gz
          echo 'afc6aec687af886eee757837792a1bb1deae00501263c3946ceb0744e494ffc9  source.tar.gz' | sha256sum -c -
          mkdir dataflow
          tar -xzf source.tar.gz -C dataflow
          python3 - <<'PY'
          from pathlib import Path
          main = Path('dataflow/app/src/main/java/com/dataflow/app/MainActivity.kt')
          if main.exists():
              text = main.read_text()
              text = text.replace('import androidx.activity.compose.rememberLauncherForActivityResult\n', 'import androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.compose.setContent\n')
              main.write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, lint and APK
        id: gradle
        working-directory: dataflow
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee gradle-build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataflow-diagnostics
          path: dataflow/gradle-build.log
          if-no-files-found: warn
      - name: Stop after Gradle failure
        if: steps.gradle.outcome == 'failure'
        run: exit 1
      - name: Verify and package
        working-directory: dataflow
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          aapt dump badging "$APK"
          apkanalyzer manifest permissions "$APK" | tee apk-permissions.txt
          ! grep -q 'android.permission.INTERNET' apk-permissions.txt
          mkdir deliverables
          cp "$APK" deliverables/DataFlow.apk
          cp README.md deliverables/README.md
          zip -r deliverables/DataFlow-source.zip . -x '.gradle/*' 'app/build/*' 'build/*' 'deliverables/*' '.idea/*' '*.jks' '*.keystore'
          sha256sum deliverables/DataFlow.apk deliverables/DataFlow-source.zip > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dataflow-deliverables
          path: dataflow/deliverables/*
          if-no-files-found: error
