name: ChessVision v0.9 Diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/chessvision-v09-diag.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/chessvision-ultra-v03b-20260823
      - id: recon
        name: Reconstruct
        continue-on-error: true
        run: bash chessvision-ultra-v09/build_source_fixed.sh > /tmp/recon.log 2>&1
      - uses: actions/setup-java@v4
        if: steps.recon.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
      - id: chess
        name: Chess22k
        if: steps.recon.outcome == 'success'
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/sandermvdb/chess22k.git /tmp/chess22k > /tmp/chess.log 2>&1
          cd /tmp/chess22k && mvn -q -DskipTests package >> /tmp/chess.log 2>&1
          mkdir -p /tmp/chessvision/app/libs
          cp target/chess22k-1.14.jar /tmp/chessvision/app/libs/chess22k-1.14.jar
      - id: core
        name: Core compile
        if: steps.recon.outcome == 'success' && steps.chess.outcome == 'success'
        continue-on-error: true
        working-directory: /tmp/chessvision
        run: |
          { rm -rf /tmp/coretest && mkdir /tmp/coretest; find app/src/main/java/fr/neo/chessvisionbot/core -name '*.java' -print0 | xargs -0 javac -cp app/libs/chess22k-1.14.jar -d /tmp/coretest; javac -cp "/tmp/coretest:app/libs/chess22k-1.14.jar" -d /tmp/coretest core-test/ScreenMapperTest.java core-test/AutoOrientationTest.java; java -cp "/tmp/coretest:app/libs/chess22k-1.14.jar" ScreenMapperTest; java -cp "/tmp/coretest:app/libs/chess22k-1.14.jar" AutoOrientationTest; } > /tmp/core.log 2>&1
      - name: Export diagnostics
        if: always()
        run: |
          git fetch origin chatgpt/chessvision-ultra-v03b-20260823
          git reset --hard origin/chatgpt/chessvision-ultra-v03b-20260823
          mkdir -p chessvision-ultra-v09-output
          {
            echo "recon=${{ steps.recon.outcome }}"
            echo "chess=${{ steps.chess.outcome }}"
            echo "core=${{ steps.core.outcome }}"
            echo '--- reconstruct log ---'
            tail -200 /tmp/recon.log 2>/dev/null || true
            echo '--- chess log ---'
            tail -80 /tmp/chess.log 2>/dev/null || true
            echo '--- core log ---'
            tail -120 /tmp/core.log 2>/dev/null || true
          } > chessvision-ultra-v09-output/diag.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chessvision-ultra-v09-output/diag.txt
          git commit -m 'ChessVision v0.9 diagnostic' || exit 0
          git push origin HEAD:chatgpt/chessvision-ultra-v03b-20260823
