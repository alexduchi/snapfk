name: Image Toolbox CI

on:
  push:
    branches: [ci-image-toolbox-20260824]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Reconstruct source
        run: |
          cat ci/image-toolbox/source.part.* | base64 -d > ImageToolbox-source.zip
          unzip -q ImageToolbox-source.zip
          chmod +x ImageToolboxProject/build.sh
      - name: Build and verify
        run: bash ImageToolboxProject/build.sh
      - name: Package source
        run: zip -qr ImageToolbox-source-final.zip ImageToolboxProject -x 'ImageToolboxProject/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ImageToolbox-delivery
          if-no-files-found: error
          path: |
            ImageToolboxProject/build/ImageToolbox.apk
            ImageToolbox-source-final.zip
            ImageToolboxProject/branding/ImageToolbox-logo.svg
