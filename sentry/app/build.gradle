plugins {
    id 'com.android.application'
}

def encodedSource = new File(rootProject.projectDir.parentFile, 'pdf-loader-source.tgz.b64')
def unpackRoot = new File(buildDir, 'pdfloader-source')

if (!encodedSource.exists()) {
    throw new GradleException('Missing pdf-loader-source.tgz.b64')
}

unpackRoot.deleteDir()
unpackRoot.mkdirs()
project.exec {
    commandLine 'bash', '-lc', "base64 -d '${encodedSource.absolutePath}' | tar -xzf - -C '${unpackRoot.absolutePath}'"
}

def pdfMain = new File(unpackRoot, 'pdf-loader-project/app/src/main')

android {
    namespace 'com.pdfloader.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pdfloader.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    sourceSets {
        main {
            manifest.srcFile new File(pdfMain, 'AndroidManifest.xml')
            java.srcDirs = [new File(pdfMain, 'java')]
            res.srcDirs = [new File(pdfMain, 'res')]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
