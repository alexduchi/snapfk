name: DataFlow Rebuild

on:
  push:
    branches:
      - dataflow-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source tree
        run: |
          test -f dataflow-project/settings.gradle.kts
          test -f dataflow-project/app/build.gradle.kts
          test -f dataflow-project/app/src/main/java/com/neo/dataflow/MainActivity.kt
          test -f dataflow-project/app/src/main/java/com/neo/dataflow/Core.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test, lint and build
        id: gradle
        working-directory: dataflow-project
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee gradle-build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataflow-diagnostics
          path: |
            dataflow-project/gradle-build.log
            dataflow-project/app/build/reports/
          if-no-files-found: warn

      - name: Stop on Gradle failure
        if: steps.gradle.outcome == 'failure'
        run: exit 1

      - name: Verify APK
        working-directory: dataflow-project
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee signature-report.txt
          aapt dump badging "$APK" | tee apk-badging.txt
          apkanalyzer manifest permissions "$APK" | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo 'INTERNET permission unexpectedly present' >&2
            exit 1
          fi

      - name: Package deliverables
        working-directory: dataflow-project
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/DataFlow.apk
          cat > deliverables/README.md <<'EOF'
          # DataFlow

          Application Android locale de suivi de consommation de donnees.

          - Android minimum : Android 8.0 (API 26)
          - Package : com.neo.dataflow
          - APK : build debug signe automatiquement
          - Aucune permission INTERNET, aucune publicite, aucun tracker
          - Statistiques : acces special Android aux donnees d'utilisation
          - Notifications : permission demandee sur Android 13+ seulement lors de l'activation
          - Mode manuel disponible si NetworkStatsManager est indisponible
          - Unites decimales operateur : 1 Go = 1 000 000 000 octets

          Installation : ouvrir DataFlow.apk et autoriser temporairement l'installation depuis cette source si Android le demande.

          Limites : Android et certains constructeurs peuvent retarder ou refuser les statistiques, limiter la separation multi-SIM et les details par application. Les alertes en arriere-plan ne sont jamais garanties a la minute pres.

          Reconstruction : JDK 17, SDK Android 35 et Gradle 8.9, puis `gradle testDebugUnitTest lintDebug assembleDebug`.
          EOF
          cp signature-report.txt apk-badging.txt apk-permissions.txt deliverables/
          zip -r deliverables/DataFlow-source.zip . \
            -x '.gradle/*' 'app/build/*' 'build/*' 'deliverables/*' '.idea/*' '*.jks' '*.keystore' 'gradle-build.log'
          sha256sum deliverables/DataFlow.apk deliverables/DataFlow-source.zip > deliverables/SHA256SUMS.txt

      - name: Upload DataFlow deliverables
        uses: actions/upload-artifact@v4
        with:
          name: DataFlow-deliverables
          path: dataflow-project/deliverables/
          if-no-files-found: error
