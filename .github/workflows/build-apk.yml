name: Build Aevum V1 APK

on:
  push:
    branches: [aevum-v1-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract project
        run: |
          mkdir -p buildsrc
          unzip -q AevumV1-project.zip -d buildsrc
      - name: Build debug APK
        working-directory: buildsrc/AevumV1
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Collect APK
        run: |
          cp buildsrc/AevumV1/app/build/outputs/apk/debug/app-debug.apk Aevum-V1-debug.apk
          sha256sum Aevum-V1-debug.apk > Aevum-V1-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Aevum-V1-APK
          path: |
            Aevum-V1-debug.apk
            Aevum-V1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
