name: ChessVision Ultra v0.4 APK

on:
  push:
    branches:
      - chatgpt/chessvision-ultra-v03b-20260823
    paths:
      - chessvision-ultra-v04-clean/**
      - .github/workflows/chessvision-fixed-build.yml
  pull_request:
    branches:
      - main
    paths:
      - chessvision-ultra-v04-clean/**
      - .github/workflows/chessvision-fixed-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore v0.3 and apply v0.4 control patch
        shell: bash
        run: |
          set -euo pipefail
          cat chessvision-fixed-build/payload/source.part00 \
              chessvision-fixed-build/payload/source.part01 \
              chessvision-fixed-build/payload/source.part02 \
              chessvision-fixed-build/payload/source.part03 \
              chessvision-fixed-build/payload/source.part04 \
              chessvision-fixed-build/payload/source.part05 | tr -d '\r\n' | base64 -d > /tmp/chessvision.zip
          echo 'c3245d2a05456134d485bced3e17ffce918b8dd93b829674639dd9d9ca293966  /tmp/chessvision.zip' | sha256sum -c -
          rm -rf /tmp/chessvision
          mkdir /tmp/chessvision
          unzip -q /tmp/chessvision.zip -d /tmp/chessvision

          base64 -d chessvision-ultra-v03/patch.b64 | gzip -dc > /tmp/v03.patch
          echo '126e8036b258ecf2d18ce9f65091535261731d5076c15142692bed22fdd5b8a6  /tmp/v03.patch' | sha256sum -c -
          patch -p1 -d /tmp/chessvision < /tmp/v03.patch

          cat chessvision-ultra-v04-clean/patch.part00 \
              chessvision-ultra-v04-clean/patch.part01 \
              chessvision-ultra-v04-clean/patch.part02 \
              chessvision-ultra-v04-clean/patch.part03 \
              chessvision-ultra-v04-clean/patch.part04 > /tmp/v04.patch
          echo '27521f6e9ca01e3baae291a37e34c424c0904ec8b0734db68a34f7d1dbf98351  /tmp/v04.patch' | sha256sum -c -
          awk '/^diff --git a\/app\/src\/main\/java\/fr\/neo\/chessvisionbot\/core\/UltraChessEngine.java/{exit} {print}' /tmp/v04.patch > /tmp/v04-main.patch
          patch -p1 -d /tmp/chessvision < /tmp/v04-main.patch

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/chessvision/app/src/main/java/fr/neo/chessvisionbot/core/UltraChessEngine.java')
          s=p.read_text()
          s,n1=re.subn(r'int\s+threads\s*=\s*1\s*;', 'int threads=2;', s, count=1)
          s,n2=re.subn(r'ttSetSize\.invoke\(null,\s*32\s*\)', 'ttSetSize.invoke(null,64)', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'engine tuning patch failed: threads={n1} tt={n2}')
          p.write_text(s)
          PY

          grep -q "versionName '0.4.0-control'" /tmp/chessvision/app/build.gradle
          grep -q 'void playMoveDrag' /tmp/chessvision/app/src/main/java/fr/neo/chessvisionbot/GestureController.java
          grep -q 'offOverlay' /tmp/chessvision/app/src/main/java/fr/neo/chessvisionbot/OverlayController.java
          grep -q 'int threads=2;' /tmp/chessvision/app/src/main/java/fr/neo/chessvisionbot/core/UltraChessEngine.java
          grep -q 'ttSetSize.invoke(null,64)' /tmp/chessvision/app/src/main/java/fr/neo/chessvisionbot/core/UltraChessEngine.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Chess22k 1.14
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chess22k
          git clone --depth 1 https://github.com/sandermvdb/chess22k.git /tmp/chess22k
          cd /tmp/chess22k
          mvn -q -DskipTests package
          test -s target/chess22k-1.14.jar
          mkdir -p /tmp/chessvision/app/libs
          cp target/chess22k-1.14.jar /tmp/chessvision/app/libs/chess22k-1.14.jar
          jar tf /tmp/chessvision/app/libs/chess22k-1.14.jar | grep -q 'nl/s22k/chess/engine/MainEngine.class'

      - name: Smoke-test engine and regenerate fixed vision models
        working-directory: /tmp/chessvision
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/UltraEngineSmoke.java <<'JAVA'
          import fr.neo.chessvisionbot.core.*;
          public final class UltraEngineSmoke {
            public static void main(String[] args) {
              UltraChessEngine e = new UltraChessEngine();
              if (!e.isUltraReady()) throw new RuntimeException("Chess22k not loaded: " + e.backend());
              ChessPosition p = ChessPosition.start();
              Move m = e.bestMove(p, 350);
              if (m == null || !p.legalMoves().contains(m)) throw new RuntimeException("invalid move " + m);
              System.out.println("ULTRA_ENGINE_OK " + e.backend() + " move=" + m.uci());
            }
          }
          JAVA

          cat > /tmp/FixedVisionSmoke.java <<'JAVA'
          import fr.neo.chessvisionbot.core.*;
          import javax.imageio.ImageIO;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import java.nio.file.*;
          public final class FixedVisionSmoke {
            public static void main(String[] args) throws Exception {
              File image = new File("app/src/main/res/drawable-nodpi/fixed_board_reference.jpg");
              File modelFile = new File("app/src/main/res/raw/fixed_piece_models.txt");
              BufferedImage b = ImageIO.read(image);
              if (b == null) throw new RuntimeException("reference image unreadable");
              int w=b.getWidth(),h=b.getHeight();
              int[] px=new int[w*h];
              b.getRGB(0,0,w,h,px,0,w);
              ImageFrame f=new ImageFrame(w,h,px);
              BoardRect r=new FixedBoardDetector().detect(f);
              if(r==null)throw new RuntimeException("fixed board not detected");
              if(!FixedTheme.compatible(f,r))throw new RuntimeException("fixed theme rejected: "+r);
              VisualBoard v=new FeatureExtractor().extract(f,r,true);
              PieceModels learned=new PieceModels();
              learned.learnStartingPosition(v);
              modelFile.getParentFile().mkdirs();
              Files.writeString(modelFile.toPath(),learned.serialize());
              PieceModels loaded=new PieceModels();
              if(!loaded.deserialize(Files.readString(modelFile.toPath())))throw new RuntimeException("generated models unreadable");
              ChessPosition start=ChessPosition.start();
              int bad=0;
              for(int i=0;i<64;i++){
                char expected=start.at(i);
                if(expected!='.' && loaded.classify(v.cells[i])!=expected)bad++;
              }
              double cost=new VisionMatcher(loaded).cost(start,v);
              if(bad!=0 || cost>=.34)throw new RuntimeException("vision mismatch bad="+bad+" cost="+cost+" rect="+r);
              System.out.println("FIXED_VISION_OK rect="+r+" bad="+bad+" cost="+cost);
            }
          }
          JAVA

          rm -rf /tmp/coretest && mkdir /tmp/coretest
          find app/src/main/java/fr/neo/chessvisionbot/core -name '*.java' -print0 | xargs -0 javac -cp app/libs/chess22k-1.14.jar -d /tmp/coretest
          javac -cp "/tmp/coretest:app/libs/chess22k-1.14.jar" -d /tmp/coretest /tmp/UltraEngineSmoke.java /tmp/FixedVisionSmoke.java
          java -cp "/tmp/coretest:app/libs/chess22k-1.14.jar" FixedVisionSmoke
          java -cp "/tmp/coretest:app/libs/chess22k-1.14.jar" UltraEngineSmoke
          test -s app/src/main/res/raw/fixed_piece_models.txt
          sha256sum app/src/main/res/raw/fixed_piece_models.txt

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/chessvision
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/chessvision/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          mkdir -p deliverables
          cp "$APK" deliverables/ChessVisionBot-Ultra-v0.4.apk
          sha256sum deliverables/ChessVisionBot-Ultra-v0.4.apk > deliverables/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVisionBot-Ultra-v0.4
          path: |
            deliverables/ChessVisionBot-Ultra-v0.4.apk
            deliverables/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
