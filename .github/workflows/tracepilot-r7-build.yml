name: TracePilot R7 Build
on:
  push:
    branches: ['tracepilot-r7-*']
    paths: ['tracepilot-r7-project.zip', '.github/workflows/tracepilot-r7-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract project
        run: mkdir tracepilot-r7 && unzip -q tracepilot-r7-project.zip -d tracepilot-r7
      - name: Build TracePilot
        run: bash tracepilot-r7/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tracepilot-r7-build
          path: |
            tracepilot-r7/dist/TracePilot-R7-FULLCORE-UNSIGNED.apk
            tracepilot-r7/dist/TracePilot-R7-FULLCORE-UNSIGNED.apk.sha256
            tracepilot-r7/dist/TracePilot-R7-source.zip
          retention-days: 2
