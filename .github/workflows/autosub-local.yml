name: Build AutoSub Local
on:
  push:
    branches: [autosub-v8-offline]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autosub-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoSub-Local-InstallFix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSub-Local-InstallFix
          path: autosub-local/AutoSub-Local-InstallFix.apk
