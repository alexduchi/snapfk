name: ChessVision Ultra v0.6 APK

on:
  push:
    branches:
      - chatgpt/chessvision-ultra-v03b-20260823
    paths:
      - chessvision-ultra-v06/**
      - .github/workflows/chessvision-fixed-build.yml
  pull_request:
    branches:
      - main
    paths:
      - chessvision-ultra-v06/**
      - .github/workflows/chessvision-fixed-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore and patch
        shell: bash
        run: |
          set -euo pipefail
          cat chessvision-fixed-build/payload/source.part00 chessvision-fixed-build/payload/source.part01 chessvision-fixed-build/payload/source.part02 chessvision-fixed-build/payload/source.part03 chessvision-fixed-build/payload/source.part04 chessvision-fixed-build/payload/source.part05 | tr -d '\r\n' | base64 -d > /tmp/chessvision.zip
          rm -rf /tmp/chessvision && mkdir /tmp/chessvision && unzip -q /tmp/chessvision.zip -d /tmp/chessvision
          base64 -d chessvision-ultra-v03/patch.b64 | gzip -dc > /tmp/v03.patch && patch -p1 -d /tmp/chessvision < /tmp/v03.patch
          cat chessvision-ultra-v04-clean/patch.part00 chessvision-ultra-v04-clean/patch.part01 chessvision-ultra-v04-clean/patch.part02 chessvision-ultra-v04-clean/patch.part03 chessvision-ultra-v04-clean/patch.part04 > /tmp/v04.patch
          awk '/^diff --git a\/app\/src\/main\/java\/fr\/neo\/chessvisionbot\/core\/UltraChessEngine.java/{exit} {print}' /tmp/v04.patch > /tmp/v04-main.patch
          patch -p1 -d /tmp/chessvision < /tmp/v04-main.patch
          mkdir -p /tmp/chessvision/app/src/main/res/raw && cp chessvision-ultra-v04-clean/fixed_piece_models.txt /tmp/chessvision/app/src/main/res/raw/fixed_piece_models.txt
          base64 -d chessvision-ultra-v05/patch.b64 | gzip -dc > /tmp/v05.patch && patch -p1 -d /tmp/chessvision < /tmp/v05.patch
          base64 -d chessvision-ultra-v06/patch.b64 | gzip -dc > /tmp/v06.patch
          patch --batch -p1 -d /tmp/chessvision < /tmp/v06.patch || true
          grep -q "versionName '0.6.0-dynamic-grid'" /tmp/chessvision/app/build.gradle
          grep -q 'class ScreenMapper' /tmp/chessvision/app/src/main/java/fr/neo/chessvisionbot/core/ScreenMapper.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Chess22k
        run: |
          git clone --depth 1 https://github.com/sandermvdb/chess22k.git /tmp/chess22k
          cd /tmp/chess22k && mvn -q -DskipTests package
          mkdir -p /tmp/chessvision/app/libs && cp target/chess22k-1.14.jar /tmp/chessvision/app/libs/chess22k-1.14.jar
      - name: Core tests
        working-directory: /tmp/chessvision
        run: |
          rm -rf /tmp/coretest && mkdir /tmp/coretest
          find app/src/main/java/fr/neo/chessvisionbot/core -name '*.java' -print0 | xargs -0 javac -cp app/libs/chess22k-1.14.jar -d /tmp/coretest
          javac -cp "/tmp/coretest:app/libs/chess22k-1.14.jar" -d /tmp/coretest core-test/ScreenMapperTest.java
          java -cp "/tmp/coretest:app/libs/chess22k-1.14.jar" ScreenMapperTest
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: /tmp/chessvision
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and collect
        run: |
          APK=/tmp/chessvision/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p deliverables && cp "$APK" deliverables/ChessVisionBot-Ultra-v0.6.apk
          sha256sum deliverables/ChessVisionBot-Ultra-v0.6.apk > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChessVisionBot-Ultra-v0.6
          path: deliverables/
          retention-days: 7
