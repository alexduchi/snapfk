name: TracePilot R7 Build
on:
  push:
    branches:
      - 'tracepilot-r7-*'
    paths:
      - 'tracepilot-r7/**'
      - '.github/workflows/tracepilot-r7-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rebuild source ZIP exactly
        run: |
          cat tracepilot-r7/chunk-00.b64 tracepilot-r7/chunk-01.b64 tracepilot-r7/chunk-02.b64 tracepilot-r7/chunk-03.b64 > tracepilot-r7-project.b64
          base64 -d tracepilot-r7-project.b64 > tracepilot-r7-project.zip
          echo '6f5d9f42f8860e803854eb9fa893f5d3325a78cf938389a20b80e8e6d6c20215  tracepilot-r7-project.zip' | sha256sum -c -
          unzip -q tracepilot-r7-project.zip
      - name: Apply compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('tracepilot_r7_project/app/src/main/java/com/neo/tracepilot')
          p=root/'TraceDb.java'
          p.write_text(p.read_text().replace('void meta(String k,String val)', 'void setMeta(String k,String val)'))
          p=root/'TrackingService.java'
          p.write_text(p.read_text().replace('db.meta(', 'db.setMeta('))
          p=root/'MainActivity.java'
          p.write_text(p.read_text().replace('db.meta("service_state","stopped");', 'db.setMeta("service_state","stopped");'))
          p=root/'ReconstructionEngine.java'
          s=p.read_text()
          old='JSONArray q=new JSONArray();q.put(g.aLat+(g.bLat-g.aLat)*f);q.put(g.aLon+(g.bLon-g.aLon)*f);a.put(q);'
          new='JSONArray q=new JSONArray();try{q.put(g.aLat+(g.bLat-g.aLat)*f);q.put(g.aLon+(g.bLon-g.aLon)*f);a.put(q);}catch(Throwable ignored){}'
          if old not in s: raise SystemExit('reconstruction patch anchor missing')
          p.write_text(s.replace(old,new))
          p=root/'MapActivity.java'
          s=p.read_text()
          old='for(TraceDb.Point q:p){JSONArray z=new JSONArray();z.put(q.lat);z.put(q.lon);z.put(q.mode);r.put(z);}'
          new='for(TraceDb.Point q:p){JSONArray z=new JSONArray();try{z.put(q.lat);z.put(q.lon);z.put(q.mode);r.put(z);}catch(Throwable ignored){}}'
          if old not in s: raise SystemExit('map patch anchor missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Build real Java D8 Android APK
        run: bash tracepilot_r7_project/build.sh
      - name: Package outputs
        run: sha256sum tracepilot_r7_project/dist/TracePilot-R7-FULLCORE-UNSIGNED.apk > tracepilot_r7_project/dist/sha256.txt
      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: tracepilot-r7-build
          path: |
            tracepilot_r7_project/dist/TracePilot-R7-FULLCORE-UNSIGNED.apk
            tracepilot_r7_project/dist/sha256.txt
            tracepilot-r7-project.zip
          if-no-files-found: error
          retention-days: 2
