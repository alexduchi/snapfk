name: TracePilot R7 Build
on:
  push:
    branches: ['tracepilot-r7-final-*']
    paths: ['tracepilot-r7/**', '.github/workflows/tracepilot-r7-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore project
        run: |
          rm -rf /tmp/tp7
          mkdir -p /tmp/tp7
          cat tracepilot-r7/chunk*.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          test "$(sha256sum /tmp/project.zip | cut -d' ' -f1)" = "ae82847360a4335a63970b53fbb5dbb402a5914c5695e09f0cb39bddaddd6e7b"
          unzip -t /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/tp7
      - name: Apply Java compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          db=Path('/tmp/tp7/tracepilot_r7_project/app/src/main/java/com/neo/tracepilot/TraceDb.java')
          s=db.read_text()
          old='public void meta(String k,String val)'
          assert old in s
          db.write_text(s.replace(old,'public void setMeta(String k,String val)',1))

          svc=Path('/tmp/tp7/tracepilot_r7_project/app/src/main/java/com/neo/tracepilot/TrackingService.java')
          s=svc.read_text()
          s=s.replace('db.meta("sat_visible",""+visible)','db.setMeta("sat_visible",""+visible)')
          s=s.replace('db.meta("sat_used",""+used)','db.setMeta("sat_used",""+used)')
          svc.write_text(s)

          rec=Path('/tmp/tp7/tracepilot_r7_project/app/src/main/java/com/neo/tracepilot/ReconstructionEngine.java')
          s=rec.read_text()
          old='static String line(TraceDb.Gap g,int n){JSONArray a=new JSONArray();for(int i=0;i<n;i++){double f=i/(double)(n-1);JSONArray p=new JSONArray();p.put(g.slat+(g.elat-g.slat)*f);p.put(g.slon+(g.elon-g.slon)*f);a.put(p);}return a.toString();}'
          new='static String line(TraceDb.Gap g,int n){try{JSONArray a=new JSONArray();for(int i=0;i<n;i++){double f=i/(double)(n-1);JSONArray p=new JSONArray();p.put(g.slat+(g.elat-g.slat)*f);p.put(g.slon+(g.elon-g.slon)*f);a.put(p);}return a.toString();}catch(Throwable t){return "[]";}}'
          assert old in s
          rec.write_text(s.replace(old,new,1))

          mp=Path('/tmp/tp7/tracepilot_r7_project/app/src/main/java/com/neo/tracepilot/MapActivity.java')
          s=mp.read_text()
          old='q.put(x.lat);q.put(x.lon);q.put(x.mode);'
          assert old in s
          mp.write_text(s.replace(old,'q.put(String.valueOf(x.lat));q.put(String.valueOf(x.lon));q.put(x.mode);',1))
          PY
      - name: Build native Android APK
        run: bash /tmp/tp7/tracepilot_r7_project/build.sh
      - name: Collect outputs
        run: |
          mkdir -p tracepilot-r7/dist
          cp -v /tmp/tp7/tracepilot_r7_project/dist/* tracepilot-r7/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tracepilot-r7-build
          path: tracepilot-r7/dist/*
          if-no-files-found: error
          retention-days: 2
