name: Image Toolbox PR Artifact Build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Reconstruct source
        run: |
          set -euo pipefail
          cat ci/image-toolbox/source.part.* | base64 -d > ImageToolbox-source.zip
          unzip -q ImageToolbox-source.zip
          chmod +x ImageToolboxProject/build.sh
      - name: Build APK
        run: bash ImageToolboxProject/build.sh
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out
          cp ImageToolboxProject/build/ImageToolbox.apk out/ImageToolbox.apk
          cp ImageToolboxProject/branding/ImageToolbox-logo.svg out/ImageToolbox-logo.svg
          zip -qr out/ImageToolbox-source.zip ImageToolboxProject -x 'ImageToolboxProject/build/*'
          sha256sum out/ImageToolbox.apk > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ImageToolbox-delivery
          if-no-files-found: error
          path: out/
