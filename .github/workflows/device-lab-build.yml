name: Device Lab Native Build

on:
  push:
    branches:
      - device-lab-build-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Apply validated v4.0.1 patch
        run: python3 device-lab-ci/build_patch.py

      - name: Build Device Lab
        run: |
          chmod +x device-lab-ci/build.sh
          device-lab-ci/build.sh

      - name: Verify APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" verify --verbose device-lab-ci/dist/DeviceLab-v4.0.apk
          unzip -t device-lab-ci/dist/DeviceLab-v4.0.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt2" dump badging device-lab-ci/dist/DeviceLab-v4.0.apk | head -25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceLab-v4.0.1-battery-fix
          if-no-files-found: error
          path: |
            device-lab-ci/dist/DeviceLab-v4.0.apk
            device-lab-ci/dist/DeviceLab-v4.0.apk.sha256
