name: ChessVision Fixed v0.2 APK

on:
  push:
    branches:
      - chatgpt/chessvision-fixed-v02-20260823
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Restore ChessVision source
        shell: bash
        run: |
          set -euo pipefail
          cat chessvision-fixed-build/payload/source.part00 \
              chessvision-fixed-build/payload/source.part01 \
              chessvision-fixed-build/payload/source.part02 \
              chessvision-fixed-build/payload/source.part03 \
              chessvision-fixed-build/payload/source.part04 \
              chessvision-fixed-build/payload/source.part05 > source.b64
          base64 -d source.b64 > ChessVisionBot-Fixed-v0.2-ci.zip
          echo 'c3245d2a05456134d485bced3e17ffce918b8dd93b829674639dd9d9ca293966  ChessVisionBot-Fixed-v0.2-ci.zip' | sha256sum -c -
          mkdir project
          unzip -q ChessVisionBot-Fixed-v0.2-ci.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" ../ChessVisionBot-Fixed-v0.2.apk
          sha256sum ../ChessVisionBot-Fixed-v0.2.apk | tee ../ChessVisionBot-Fixed-v0.2.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVisionBot-Fixed-v0.2
          path: |
            ChessVisionBot-Fixed-v0.2.apk
            ChessVisionBot-Fixed-v0.2.sha256
          if-no-files-found: error
          retention-days: 7
