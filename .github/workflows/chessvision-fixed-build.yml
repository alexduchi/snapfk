name: ChessVision Fixed APK

on:
  push:
    branches:
      - chatgpt/chessvision-fixed-v02-20260823
    paths:
      - chessvision-fixed-build/payload/**
      - .github/workflows/chessvision-fixed-build.yml
  pull_request:
    branches:
      - main
    paths:
      - chessvision-fixed-build/payload/**
      - .github/workflows/chessvision-fixed-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore isolated source
        run: |
          cat chessvision-fixed-build/payload/source.part* | tr -d '\r\n' | base64 -d > /tmp/chessvision.zip
          sha256sum /tmp/chessvision.zip
          unzip -t /tmp/chessvision.zip
          rm -rf /tmp/chessvision
          mkdir /tmp/chessvision
          unzip -q /tmp/chessvision.zip -d /tmp/chessvision

      - name: Build debug APK
        working-directory: /tmp/chessvision
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=/tmp/chessvision/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          aapt dump badging "$APK" | head -n 8
          mkdir -p deliverables
          cp "$APK" deliverables/ChessVisionBot-Fixed-v0.2.apk
          sha256sum deliverables/ChessVisionBot-Fixed-v0.2.apk > deliverables/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVisionBot-Fixed-v0.2
          path: |
            deliverables/ChessVisionBot-Fixed-v0.2.apk
            deliverables/SHA256SUMS.txt
          if-no-files-found: error
