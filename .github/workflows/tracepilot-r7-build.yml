name: TracePilot R7 Build
on:
  push:
    branches: ['tracepilot-r7-final-*']
    paths: ['tracepilot-r7/**', '.github/workflows/tracepilot-r7-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore project
        run: |
          rm -rf /tmp/tp7
          mkdir -p /tmp/tp7
          cat tracepilot-r7/chunk*.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          sha256sum /tmp/project.zip
          test "$(sha256sum /tmp/project.zip | cut -d' ' -f1)" = "ae82847360a4335a63970b53fbb5dbb402a5914c5695e09f0cb39bddaddd6e7b"
          unzip -t /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/tp7
      - name: Build native Android APK
        run: bash /tmp/tp7/tracepilot_r7_project/build.sh
      - name: Collect outputs
        run: |
          mkdir -p tracepilot-r7/dist
          cp -v /tmp/tp7/tracepilot_r7_project/dist/* tracepilot-r7/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tracepilot-r7-build
          path: tracepilot-r7/dist/*
          if-no-files-found: error
          retention-days: 2
