name: DataFlow Android Build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore source tree
        run: |
          cat dataflow-src.part1 dataflow-src.part2 dataflow-src.part3 dataflow-src.part4a dataflow-src.part4b dataflow-src.part4c > source.b64
          test "$(wc -c < source.b64)" = "37224"
          base64 -d source.b64 > source.tar.gz
          echo '4a7b0a39f95a4ee656b3aea2574db37796a1aab0cef329cdf27f1a1b1f66ee67  source.tar.gz' | sha256sum -c -
          mkdir dataflow
          tar -xzf source.tar.gz -C dataflow
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dataflow/app/src/main/java/com/dataflow/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('import androidx.activity.compose.rememberLauncherForActivityResult\n', 'import androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.compose.setContent\n')
          s = s.replace('Intent(Settings.ACTION_DATA_SAVER_SETTINGS)', 'Intent("android.settings.DATA_SAVER_SETTINGS")')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build
        id: gradle
        working-directory: dataflow
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee gradle-build.log
      - name: Show focused diagnostics
        if: steps.gradle.outcome == 'failure'
        working-directory: dataflow
        run: |
          grep -n -E '(^e: | error: |FAILURE:|What went wrong|Compilation error|Unresolved reference|Exception)' gradle-build.log | tail -n 250 || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataflow-diagnostics
          path: dataflow/gradle-build.log
          if-no-files-found: warn
      - name: Stop on Gradle failure
        if: steps.gradle.outcome == 'failure'
        run: exit 1
      - name: Verify APK
        working-directory: dataflow
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee signature-report.txt
          aapt dump badging "$APK" | tee apk-badging.txt
          apkanalyzer manifest permissions "$APK" | tee apk-permissions.txt
          ! grep -q 'android.permission.INTERNET' apk-permissions.txt
      - name: Package
        working-directory: dataflow
        run: |
          mkdir deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/DataFlow.apk
          cp README.md deliverables/README.md
          cp signature-report.txt apk-badging.txt apk-permissions.txt deliverables/
          zip -r deliverables/DataFlow-source.zip . -x '.gradle/*' 'app/build/*' 'build/*' 'deliverables/*' '.idea/*' '*.jks' '*.keystore'
          sha256sum deliverables/DataFlow.apk deliverables/DataFlow-source.zip > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dataflow-deliverables
          path: dataflow/deliverables/*
          if-no-files-found: error
