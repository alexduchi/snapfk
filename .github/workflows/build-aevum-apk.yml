name: Build Aevum APK

on:
  push:
    branches:
      - agent/aevum-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          mkdir project
          unzip -q aevum_payload.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle --stacktrace assembleDebug

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Aevum-V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aevum-V1-APK
          path: Aevum-V1.apk
          if-no-files-found: error
