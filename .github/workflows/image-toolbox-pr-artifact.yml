name: Image Toolbox PR Artifact Build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Reconstruct source
        run: |
          set -euo pipefail
          cat \
            ci/image-toolbox/source.part.00 \
            ci/image-toolbox/source.part.01 \
            ci/image-toolbox/source.part.02 \
            ci/image-toolbox/source.part.03a \
            ci/image-toolbox/source.part.03b0 \
            ci/image-toolbox/source.part.03e0 \
            ci/image-toolbox/source.part.03f0 \
            ci/image-toolbox/source.part.03f1 \
            ci/image-toolbox/source.part.03d1 \
            ci/image-toolbox/source.part.03d2 \
            ci/image-toolbox/source.part.03d3 \
            ci/image-toolbox/source.part.03d4 \
            ci/image-toolbox/source.part.03d5 \
            ci/image-toolbox/source.part.03d6 \
            ci/image-toolbox/source.part.04 \
            | base64 -d > ImageToolbox-source.zip
          echo '934d7684c37907505921b66d5d87e8e685388b0acb34db5cb9a3ddd4ed04f4e0  ImageToolbox-source.zip' | sha256sum -c -
          unzip -q ImageToolbox-source.zip
          sed -i '/postSplashScreenTheme/d' ImageToolboxProject/res/values-v31/styles.xml ImageToolboxProject/res/values-night-v31/styles.xml
          chmod +x ImageToolboxProject/build.sh
      - name: Build APK and capture log
        run: |
          set +e
          bash ImageToolboxProject/build.sh > build.log 2>&1
          status=$?
          echo "$status" > build.status
          cat build.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ImageToolbox-build-log
          if-no-files-found: error
          path: |
            build.log
            build.status
      - name: Enforce build result
        run: test "$(cat build.status)" = "0"
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out
          cp ImageToolboxProject/build/ImageToolbox.apk out/ImageToolbox.apk
          cp ImageToolboxProject/branding/ImageToolbox-logo.svg out/ImageToolbox-logo.svg
          zip -qr out/ImageToolbox-source.zip ImageToolboxProject -x 'ImageToolboxProject/build/*'
          sha256sum out/ImageToolbox.apk > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ImageToolbox-delivery
          if-no-files-found: error
          path: out/
