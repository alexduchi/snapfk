name: AirControl APK build
on:
  push:
    branches: [aircontrol-build-temp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        run: |
          mkdir -p ~/.android
          base64 -d aircontrol/ci/dev-keystore.b64 > ~/.android/debug.keystore
      - name: Download official MediaPipe hand model
        run: |
          mkdir -p aircontrol/app/src/main/assets
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task \
            -o aircontrol/app/src/main/assets/hand_landmarker.task
          test -s aircontrol/app/src/main/assets/hand_landmarker.task
      - name: Build debug APK
        working-directory: aircontrol
        run: gradle --no-daemon assembleDebug
      - name: Collect APK
        run: cp aircontrol/app/build/outputs/apk/debug/app-debug.apk AirControl.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AirControl-apk
          path: AirControl.apk
          if-no-files-found: error
