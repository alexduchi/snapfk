name: Build Media Toolbox APK

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'chatgpt/media-toolbox-build-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          : > MediaToolbox-source.partial.zip
          for f in \
            ci/media-toolbox/source.part.00 \
            ci/media-toolbox/source.part.01 \
            ci/media-toolbox/source.part.02 \
            ci/media-toolbox/source.part.03 \
            ci/media-toolbox/source.part.04 \
            ci/media-toolbox/source.part.05 \
            ci/media-toolbox/source.part.06 \
            ci/media-toolbox/source.part.07 \
            ci/media-toolbox/source.part.08 \
            ci/media-toolbox/fix09.0 \
            ci/media-toolbox/fix09.1 \
            ci/media-toolbox/fix10.0 \
            ci/media-toolbox/good10b.0 \
            ci/media-toolbox/good10b.1 \
            ci/media-toolbox/good11.0 \
            ci/media-toolbox/good11.1 \
            ci/media-toolbox/good11.2 \
            ci/media-toolbox/good12.0 \
            ci/media-toolbox/good12.1 \
            ci/media-toolbox/good12.2; do
              tr -d '[:space:]' < "$f" | base64 --decode >> MediaToolbox-source.partial.zip
          done
          zip -FF MediaToolbox-source.partial.zip --out MediaToolbox-sources-repaired.zip
          unzip -t MediaToolbox-sources-repaired.zip
          unzip -q MediaToolbox-sources-repaired.zip
          test -f MediaToolbox/settings.gradle.kts
          test -f MediaToolbox/app/build.gradle.kts
          test -f MediaToolbox/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = 37/compileSdk = 36/' MediaToolbox/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' MediaToolbox/app/build.gradle.kts

      - name: Validate project
        run: python3 MediaToolbox/tools/validate_project.py

      - name: Build debug APK
        working-directory: MediaToolbox
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp MediaToolbox/app/build/outputs/apk/debug/app-debug.apk out/MediaToolbox.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs out/MediaToolbox.apk | tee out/APK_VERIFY.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging out/MediaToolbox.apk | tee out/APK_BADGING.txt
          unzip -t out/MediaToolbox.apk > out/APK_ZIP_TEST.txt
          sha256sum out/MediaToolbox.apk | tee out/MediaToolbox-apk.sha256
          cp MediaToolbox-sources-repaired.zip out/MediaToolbox-sources.zip

      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-delivery
          path: out/
          if-no-files-found: error
          retention-days: 7
