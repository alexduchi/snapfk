name: DataFlow Android Build

on:
  pull_request:
    paths:
      - 'dataflow/**'
      - '.github/workflows/dataflow-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: dataflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --stacktrace testDebugUnitTest
      - name: Lint
        run: gradle --stacktrace lintDebug
      - name: Assemble signed debug APK
        run: gradle --stacktrace assembleDebug
      - name: Verify manifest and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee signature-report.txt
          aapt dump badging "$APK" | tee apk-badging.txt
          apkanalyzer manifest permissions "$APK" | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then exit 1; fi
      - name: Prepare deliverables
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/DataFlow.apk
          cp README.md deliverables/README.md
          cp signature-report.txt apk-badging.txt apk-permissions.txt deliverables/
          zip -r deliverables/DataFlow-source.zip . -x '.gradle/*' 'app/build/*' 'build/*' 'deliverables/*' '.idea/*' '*.jks' '*.keystore'
          sha256sum deliverables/DataFlow.apk deliverables/DataFlow-source.zip > deliverables/SHA256SUMS.txt
          printf 'Compilation: successful\nTests: successful\nLint: successful\nSignature: verified\n' > deliverables/build-report.txt
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: dataflow-deliverables
          path: dataflow/deliverables/*
          if-no-files-found: error
          retention-days: 30
