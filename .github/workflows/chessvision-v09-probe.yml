name: ChessVision v0.9 Probe
on:
  push:
    branches: [chatgpt/chessvision-ultra-v03b-20260823]
    paths:
      - .github/workflows/chessvision-v09-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/chessvision-ultra-v03b-20260823
      - run: |
          mkdir -p chessvision-ultra-v09-output
          date -u > chessvision-ultra-v09-output/probe.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chessvision-ultra-v09-output/probe.txt
          git commit -m 'ChessVision v0.9 CI probe' || exit 0
          git push origin HEAD:chatgpt/chessvision-ultra-v03b-20260823
