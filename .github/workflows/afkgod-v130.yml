name: AFK God Android v1.3.0 temporary build

on:
  push:
    branches:
      - temp-afkgod-apk-v130
    paths:
      - .github/workflows/afkgod-v130.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build APK
        working-directory: tmp-afkgod-v130
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare artifact
        run: cp tmp-afkgod-v130/app/build/outputs/apk/debug/app-debug.apk /tmp/AFKGodNode-Android-v1.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AFKGodNode-Android-v1.3.0
          path: /tmp/AFKGodNode-Android-v1.3.0.apk
          if-no-files-found: error
