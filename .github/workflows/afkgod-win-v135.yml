name: AFK God Windows v1.3.5 build

on:
  push:
    branches:
      - temp-afkgod-win-v135
    paths:
      - .github/workflows/afkgod-win-v135.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Restore source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\afkgod | Out-Null
          $b64 = (Get-Content -Raw tmp-afkgod-win-v135/source.part1.b64) + (Get-Content -Raw tmp-afkgod-win-v135/source.part2.b64)
          [IO.File]::WriteAllBytes('C:\afkgod\src.tgz',[Convert]::FromBase64String($b64))
          tar -xzf C:\afkgod\src.tgz -C C:\afkgod
      - name: Install manifest resource tool
        shell: powershell
        run: go install github.com/akavel/rsrc@latest
      - name: Embed requireAdministrator manifest
        shell: powershell
        working-directory: C:\afkgod
        run: rsrc -manifest app.manifest -o rsrc.syso
      - name: Test
        shell: powershell
        working-directory: C:\afkgod
        run: |
          go test ./...
          go vet ./...
      - name: Build Windows GUI
        shell: powershell
        working-directory: C:\afkgod
        run: go build -ldflags="-H windowsgui -s -w" -o AFKGodNode-Windows-v1.3.5.exe .
      - name: Verify fresh-install regression removed
        shell: powershell
        working-directory: C:\afkgod
        run: |
          if (Select-String -Path main.go -SimpleMatch 'taskkill.exe", "/F", "/IM", "AFKGodNode.exe' -Quiet) { throw 'Unsafe broad taskkill still present' }
          if (!(Test-Path AFKGodNode-Windows-v1.3.5.exe)) { throw 'EXE missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: AFKGodNode-Windows-v1.3.5
          path: C:\afkgod\AFKGodNode-Windows-v1.3.5.exe
          if-no-files-found: error
