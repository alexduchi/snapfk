name: Build Aevum APK

on:
  push:
    branches:
      - agent/aevum-apk-build
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/aevum-apk-build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q aevum_payload.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle --stacktrace assembleDebug

      - name: Publish APK to branch
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk Aevum-V1.apk
          sha256sum Aevum-V1.apk > Aevum-V1.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Aevum-V1.apk Aevum-V1.apk.sha256
          git commit -m 'Publish compiled Aevum V1 APK'
          git push origin HEAD:agent/aevum-apk-build
